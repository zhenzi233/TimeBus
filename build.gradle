plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id 'xyz.wagyourtail.unimined' version '1.4.26-kappa'
    id 'net.kyori.blossom' version '2.2.0'
    id 'com.modrinth.minotaur' version '2.9.0'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

import org.jetbrains.gradle.ext.Gradle

ext {
    access_transformer_locations = "${mod_id}_at.cfg"
}

version = mod_version
group = root_package

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    if (generate_sources_jar.toBoolean()) {
        withSourcesJar()
    }
    if (generate_javadocs_jar.toBoolean()) {
        withJavadocJar()
    }
}

configurations {
    contain
    implementation.extendsFrom(contain)
    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
    modRuntimeOnly
    runtimeOnly.extendsFrom(modRuntimeOnly)
}

def remapTaskName = enable_shadow.toBoolean() ? "remapShadowJar" : "remapJar"

unimined.minecraft {
    version "1.12.2"

    mappings {
        mcp("stable", "39-1.12")
    }

    cleanroom {
        if (use_access_transformer.toBoolean()) {
            accessTransformer "${rootProject.projectDir}/src/main/resources/$access_transformer_locations"
        }
        loader "0.5.17-alpha"
        runs.all {
            systemProperty("crl.dev.mixin", "${mod_id}.default.mixin.json,${mod_id}.mod.mixin.json,${mod_id}.mm.mixin.json,${mod_id}.mek.mixin.json")
            args += ['--username', minecraft_username]
            def extraArgs = extra_jvm_args
            if (extraArgs != null && !extraArgs.trim().isEmpty()) {
                jvmArgs += extraArgs.split("\\s+").toList()
            }
            if (enable_foundation_debug.toBoolean()) {
                systemProperty("foundation.dump", "true")
                systemProperty("foundation.verbose", "true")
            }
            if (is_coremod.toBoolean()) {
                systemProperty("fml.coreMods.load", coremod_plugin_class_name)
            }
            return
        }
    }

    defaultRemapJar = false

    String jarTaskName = enable_shadow.toBoolean() ? "shadowJar" : "jar"

    remap(tasks.named(jarTaskName).get()) {
        mixinRemap {
            enableBaseMixin()
            enableMixinExtra()
        }
    }

    mods {
        remap(configurations.modCompileOnly)
        remap(configurations.modRuntimeOnly)
    }
}

dependencies {
    if (use_asset_mover.toBoolean()) {
        implementation "com.cleanroommc:assetmover:${asset_mover_version}"
    }
    if (enable_junit_testing.toBoolean()) {
        testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    // Mixin annotation processor: generates the full mcp->searge refmap
    // (method-level mappings) that released jars need. Without it the refmap
    // only contains class mappings and every @Inject/@Redirect/@ModifyArg
    // target name (MCP) silently fails to match in the obfuscated runtime.
    annotationProcessor "com.cleanroommc:sponge-mixin:0.20.13+mixin.0.8.7"
}

compileJava {
    // The released jar ships a hand-maintained refmap
    // (src/main/resources/timebus.mod.mixin-refmap.json) that maps the only
    // MC-class target used by our mixins (ItemStack.getCount -> func_190916_E).
    // AE2 targets need no mapping (AE2 is never obfuscated). The mixin
    // annotation processor otherwise writes its own (class-only, mapping-less)
    // refmap over our resources copy, so redirect its output into a scratch dir.
    options.compilerArgs += [
            "-AoutRefMapFile=${project.buildDir}/apt-refmap/timebus.mod.mixin-refmap.json"
    ]
}

apply from: 'gradle/scripts/dependencies.gradle'
apply from: 'gradle/scripts/publish-platforms.gradle'

// CurseForge 发布任务：插件类只在主脚本编译期可见，因此不放入上面的脚本
task publishCurseForge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = '上传发布到 CurseForge'
    apiToken = System.getenv('CURSEFORGE_TOKEN') ?: findProperty('curseforge_token')
    debugMode = project.ext.publishDebugMode

    def projectId = findProperty('curseforge_project_id')
    if (projectId) {
        def mainFile = upload(projectId, tasks.named(project.ext.publishJarTaskName))
        mainFile.changelog = project.ext.publishChangelog
        mainFile.changelogType = 'markdown'
        mainFile.releaseType = 'release'
        mainFile.addGameVersion('1.12.2')
        mainFile.addModLoader('Forge')
        mainFile.addEnvironment('Client', 'Server')
        mainFile.addRelation('ae2-extended-life', 'requiredDependency')
    }
    dependsOn tasks.named(project.ext.publishJarTaskName)
}

processResources {
    rename '(.+_at.cfg)', 'META-INF/$1'
    filesMatching('mcmod.info') {
        expand 'mod_version': mod_version
    }
}

sourceSets {
    main {
        blossom {
            javaSources {
                property('mod_id', mod_id)
                property('mod_name', mod_name)
                property('mod_version', mod_version)
                property('package', "${root_package}.${mod_id}")
            }
        }
    }
}

idea {
    module {
        inheritOutputDirs = true
    }
    project {
        settings {
            runConfigurations {
                '1. Build'(Gradle) {
                    taskNames = ["build"]
                }
                '2. Run Client'(Gradle) {
                    taskNames = ["runClient"]
                }
                '3. Run Server'(Gradle) {
                    taskNames = ["runServer"]
                }
            }
            compiler.javac {
                afterEvaluate {
                    javacAdditionalOptions = '-encoding utf8'
                    moduleJavacAdditionalOptions = [
                            (project.name + '.main'): tasks.compileJava.options.compilerArgs.collect { "\"${it}\"" }.join(' ')
                    ]
                }
            }
            taskTriggers {
                afterSync tasks.named("genSources")
            }
        }
    }
}

if (!enable_shadow.toBoolean()) {
    shadowJar.enabled = false
}

compileJava {
    // 运行环境兼容性：1.12.2 原版 Forge 的 mod 发现用 ASM 5.2，只能解析
    // class 52（Java 8）；Java 17 字节码（class 61）会被静默忽略导致客户端
    // mod 列表缺失。编译工具链仍是 JDK 25，这里只把产物 target 降到 Java 8。
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
    archiveClassifier = 'dev'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    if (configurations.contain.size() > 0) {
        into('/') {
            from configurations.contain
        }
    }
    doFirst {
        manifest {
            def attribute_map = [:]
            attribute_map['MixinConfigs'] = "${mod_id}.default.mixin.json,${mod_id}.mod.mixin.json,${mod_id}.mm.mixin.json,${mod_id}.mek.mixin.json"
            if (configurations.contain.size() > 0) {
                attribute_map['ContainedDeps'] = configurations.contain.collect { it.name }.join(' ')
                attribute_map['NonModDeps'] = true
            }
            if (is_coremod.toBoolean()) {
                attribute_map['FMLCorePlugin'] = coremod_plugin_class_name
                if (coremod_includes_mod.toBoolean()) {
                    attribute_map['FMLCorePluginContainsFMLMod'] = true
                }
            }
            if (use_access_transformer.toBoolean()) {
                attribute_map['FMLAT'] = access_transformer_locations
            }
            attributes(attribute_map)
        }
    }
    finalizedBy(tasks.named(remapTaskName).get())
}

shadowJar {
    configurations = [project.configurations.shadow]
    archiveClassifier = "shadow"
}

tasks.named(remapTaskName).configure {
    doFirst {
        logging.captureStandardOutput LogLevel.INFO
    }
    doLast {
        logging.captureStandardOutput LogLevel.QUIET
    }
}

compileTestJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
}

test {
    useJUnitPlatform()
    if (show_testing_output.toBoolean()) {
        testLogging {
            showStandardStreams = true
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: 'gradle/scripts/publishing.gradle'
apply from: 'gradle/scripts/extra.gradle'
