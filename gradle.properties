# Gradle Properties
# Gradle 运行环境用 JDK 17（Gradle 8.10 不支持 JDK 25）
org.gradle.java.home=C:\\Program Files\\Java\\jdk-17.0.4.1
# 注册 JDK 25 给 toolchain 用于编译
org.gradle.java.installations.paths=C:\\Java\\jdk-25.0.3+9
org.gradle.jvmargs = -Xmx3G

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = true
show_testing_output = false

# Shadow
enable_shadow = false

# Set this to true if you want to use old LWJGL2 methods.
enable_lwjglx = true

# Mod Information
mod_version = 1.0.3
root_package = com.zhenzi233
mod_id = timebus
mod_name = Time Bus

# Mod Metadata (Optional)
mod_description = A time acceleration block that speeds up blocks on its facing side.
mod_url =
mod_update_json =
mod_authors = zhenzi233
mod_credits =
mod_logo_path =

# Run Configurations
minecraft_username = Developer
extra_jvm_args =
enable_foundation_debug = false

# Maven Publishing
publish_to_maven = false
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =

# Access Transformers
use_access_transformer = true

# Coremods
is_coremod = false
coremod_includes_mod = true
coremod_plugin_class_name =

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5
