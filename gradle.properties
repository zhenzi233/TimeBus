# Gradle Properties
# Gradle 运行环境：运行 Gradle 的 JDK 由 JAVA_HOME 或系统默认 java 决定
# （建议 JDK 17，Gradle 8.10 不支持 JDK 25 运行）。不要在本文件写死本机
# 绝对路径，否则他人 clone 后无法构建。
# 编译 toolchain 需要 JDK 25：把环境变量 JDK25 指向 JDK 25 安装目录即可
# 被下面的 fromEnv 注册自动发现（也可以改成你自己的环境变量名）。
org.gradle.java.installations.fromEnv=JDK25
org.gradle.jvmargs = -Xmx3G

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = true

# Testing
enable_junit_testing = true
show_testing_output = false

# Shadow
enable_shadow = false

# Set this to true if you want to use old LWJGL2 methods.
enable_lwjglx = true

# Mod Information
mod_version = 1.0.13
root_package = com.zhenzi233
mod_id = timebus
mod_name = Time Bus

# Mod Metadata (Optional)
mod_description = A time acceleration block that speeds up blocks on its facing side.
mod_url = https://github.com/zhenzi233/TimeBus
mod_update_json = https://raw.githubusercontent.com/zhenzi233/TimeBus/master/update.json
mod_authors = zhenzi233
mod_credits = Codewhale (AI assistance)
mod_logo_path =

# Run Configurations
minecraft_username = Developer
extra_jvm_args =
enable_foundation_debug = false

# Maven Publishing
publish_to_maven = false
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =

# Platform Publishing
# Modrinth 项目 ID 或 slug（项目主页网址末尾），如 xxx
modrinth_project_id =
# CurseForge 数字项目 ID（项目主页网址末尾的数字），如 123456
curseforge_project_id = 1638678

# Access Transformers
use_access_transformer = true

# Coremods
is_coremod = false
coremod_includes_mod = true
coremod_plugin_class_name =

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5
