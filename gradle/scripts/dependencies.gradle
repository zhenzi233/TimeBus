repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    maven {
        name = 'CleanroomCurseMaven'
        url = 'https://curse.cleanroommc.com'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'CleanroomMaven'
        url = 'https://repo.cleanroommc.com/releases'
    }
    mavenCentral()
    maven {
        name = 'JEI'
        url = 'https://dvs1.progwml6.com/files/maven'
    }
    mavenLocal()
}

dependencies {
    compileOnly "com.cleanroommc:sponge-mixin:0.20.13+mixin.0.8.7"
    // JEI - 通过 CurseForge 文件 (CurseForge 项目 557549 / 文件 8605435)
    modImplementation "curse.maven:jei-557549:8605435"
    // AE2 UEL - 通过 CurseMaven 自动下载
    modImplementation "curse.maven:ae2-extended-life-570458:6302098"
    // Modular Machinery CE (CurseForge 817377) - 运行期软依赖（反射加速）；
    // 编译期引用仅用于让 Mixin 注解处理器校验 targets（不打包、不强制运行时依赖）。
    modCompileOnly "curse.maven:modularmachinery-community-edition-817377:7372951"
    modRuntimeOnly "curse.maven:modularmachinery-community-edition-817377:7372951"
    // MMCE 硬依赖 CraftTweaker>=4.0.4；dev 环境要加载 MMCE 就必须带上它，
    // 其 FMLAT 条目已合并进 timebus_at.cfg（见 src/main/resources/timebus_at.cfg）。
    modRuntimeOnly "curse.maven:crafttweaker-239197:8051578"
    // Mekanism CE-Unofficial (CurseForge 840735) - 运行期软依赖（虚拟速度卡 Mixin）；
    // 编译期引用仅用于让 Mixin 注解处理器校验 targets（不打包、不强制运行时依赖）。
    modCompileOnly "curse.maven:mekanism-ce-unofficial-840735:8519677"
    modRuntimeOnly "curse.maven:mekanism-ce-unofficial-840735:8519677"

    // The One Probe
    modImplementation "curse.maven:the-one-probe-245211:2667280"
    // MouseTweaks Unofficial (Cleanroom fork, contains IMTModGuiContainer2)
    implementation "curse.maven:mouse-tweaks-unofficial-461660:5876158"

    if (enable_lwjglx.toBoolean()) {
        compileOnly "com.cleanroommc:lwjglx:1.0.0"
    }
}
